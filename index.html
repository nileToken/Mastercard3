
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastercard Withdrawal</title>
</head>
<body>
    <h1>Withdraw Funds Using Mastercard</h1>
    <form id="withdrawal-form">
        <label for="account-number">Account Number:</label>
        <input type="text" id="account-number" name="account-number" required><br><br>

        <label for="amount">Withdrawal Amount:</label>
        <input type="number" id="amount" name="amount" required><br><br>

        <button type="submit">Request Withdrawal</button>
    </form>

    <script>
        document.getElementById('withdrawal-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission
            const accountNumber = document.getElementById('account-number').value;
            const amount = document.getElementById('amount').value;
            // Logic for processing withdrawal can be added here
            alert('Withdrawal request submitted for account ' + accountNumber + ' in the amount of ' + amount);
        });
    </script>
</body>
</html>
